name: Publish reconciled FTO dossier to main
on:
  push:
    branches: [tmp/fto-ensembl116-extraction]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build audited FTO dossier
        run: |
          set -euo pipefail
          OUT='02_obligatorio/temas_candidatos/FTO_dossier'
          DATA="$OUT/datos"
          TMP='/tmp/fto_dossier'
          mkdir -p "$DATA" "$TMP"
          wget -q https://ftp.ensembl.org/pub/release-116/gff3/homo_sapiens/Homo_sapiens.GRCh38.116.chromosome.16.gff3.gz -O "$TMP/gene.gff3.gz"
          wget -q https://ftp.ensembl.org/pub/release-116/regulation/homo_sapiens/GRCh38/annotation/Homo_sapiens.GRCh38.regulatory_features.v116.gff3.gz -O "$TMP/reg.gff3.gz"
          curl -fsSL 'https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr16;start=53703858;end=53704156' -o "$TMP/sequence.json"
          curl -fsSL 'https://api.genome.ucsc.edu/getData/track?genome=hg38;track=encodeCcreCombined;chrom=chr16;start=53703858;end=53704156;maxItemsOutput=10000' -o "$TMP/ccre.json"
          curl -fsSL 'https://api.genome.ucsc.edu/getData/track?genome=hg38;track=geneHancerRegElements;chrom=chr16;start=53703858;end=53704156;maxItemsOutput=10000' -o "$TMP/genehancer.json"
          curl -fsSL 'https://api.genome.ucsc.edu/getData/track?genome=hg38;track=cpgIslandExt;chrom=chr16;start=53703858;end=53704156;maxItemsOutput=10000' -o "$TMP/cpg.json"
          python - <<'PY'
          import gzip,csv,json,urllib.parse,statistics
          from pathlib import Path

          OUT=Path('02_obligatorio/temas_candidatos/FTO_dossier')
          DATA=OUT/'datos'; TMP=Path('/tmp/fto_dossier')
          GENE='ENSG00000140718'; FTO_TX='ENST00000471389'; RP_TX='ENST00000647211'

          def parse_attrs(s):
              d={}
              for x in s.split(';'):
                  if '=' in x:
                      k,v=x.split('=',1); d[k]=urllib.parse.unquote(v)
              return d

          def write_csv(path,rows,fieldnames=None):
              if fieldnames is None:
                  fieldnames=[]
                  for r in rows:
                      for k in r:
                          if k not in fieldnames: fieldnames.append(k)
              with open(path,'w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fieldnames); w.writeheader(); w.writerows(rows)

          # Gene/transcript/exon annotation from Ensembl 116
          fto_tx=None; rp_tx=None; exons=[]; all_fto_tss=[]; all_rp_tss=[]
          with gzip.open(TMP/'gene.gff3.gz','rt') as f:
              for line in f:
                  if line.startswith('#'): continue
                  p=line.rstrip('\n').split('\t')
                  if len(p)!=9: continue
                  seq,src,typ,start,end,score,strand,phase,a=p
                  d=parse_attrs(a); start=int(start); end=int(end)
                  tid=d.get('transcript_id') or d.get('ID','').split(':')[-1]
                  parent=d.get('Parent','')
                  if typ in ('mRNA','transcript'):
                      tss=start if strand=='+' else end
                      if GENE in parent: all_fto_tss.append((tid,tss,strand,d.get('Name',''),d.get('tag','')))
                      if 'ENSG00000103494' in parent: all_rp_tss.append((tid,tss,strand,d.get('Name',''),d.get('tag','')))
                      if tid==FTO_TX: fto_tx={'id':tid,'name':d.get('Name'),'start':start,'end':end,'strand':strand,'version':d.get('version'),'tags':d.get('tag',''),'tss':tss}
                      if tid==RP_TX: rp_tx={'id':tid,'name':d.get('Name'),'start':start,'end':end,'strand':strand,'version':d.get('version'),'tags':d.get('tag',''),'tss':tss}
                  if typ=='exon' and FTO_TX in a:
                      exons.append({'chrom':'chr16','start_1based':start,'end_1based':end,'length_bp':end-start+1,'strand':strand,'rank':int(d.get('rank',0)),'exon_id':d.get('exon_id') or d.get('Name'),'transcript_id':FTO_TX,'transcript_version':'6','source':'Ensembl 116 / GENCODE 50'})
          assert fto_tx and rp_tx
          exons=sorted(exons,key=lambda r:r['rank'])
          write_csv(DATA/'FTO_exones_MANE_Ensembl116_GRCh38.csv',exons)

          # Full FTO interval + 1.8 kb upstream regulatory build
          region_start=fto_tx['tss']-1800; region_end=fto_tx['end']
          regs=[]
          with gzip.open(TMP/'reg.gff3.gz','rt') as f:
              for line in f:
                  if line.startswith('#'): continue
                  p=line.rstrip('\n').split('\t')
                  if len(p)!=9 or p[0] not in ('16','chr16'): continue
                  s,e=int(p[3]),int(p[4])
                  if e<region_start or s>region_end: continue
                  d=parse_attrs(p[8])
                  regs.append({'chrom':'chr16','start_1based':s,'end_1based':e,'length_bp':e-s+1,'strand':p[6],'type':p[2],'regulatory_id':d.get('ID',''),'gene_id':d.get('gene_id',''),'gene_name':d.get('gene_name',''),'gene_biotype':d.get('gene_biotype',''),'source':'Ensembl Regulatory Build 116','raw_attributes':p[8]})
          regs=sorted(regs,key=lambda r:(r['start_1based'],r['end_1based'],r['type']))
          enh=[r for r in regs if r['type']=='enhancer']
          write_csv(DATA/'FTO_todos_elementos_regulatorios_Ensembl116_GRCh38_1p8kb_upstream.csv',regs)
          write_csv(DATA/'FTO_enhancers_Ensembl116_GRCh38_1p8kb_upstream.csv',enh)

          # Exact inter-TSS interval, using MANE TSSs
          left=rp_tx['tss']; right=fto_tx['tss']
          assert left<right
          seqj=json.loads((TMP/'sequence.json').read_text()); seq=seqj['dna'].upper()
          assert len(seq)==right-left+1
          (DATA/'FTO_RPGRIP1L_interTSS_GRCh38.fa').write_text(f'>chr16:{left}-{right} GRCh38 1-based-inclusive; RPGRIP1L_MANE_TSS_to_FTO_MANE_TSS\n{seq}\n',encoding='utf-8')

          inter=[]
          for r in regs:
              if r['end_1based']>=left and r['start_1based']<=right:
                  inter.append({'category':'regulatory_region','source':r['source'],'element_id':r['regulatory_id'],'element_type':r['type'],'assembly':'GRCh38','start_1based':r['start_1based'],'end_1based':r['end_1based'],'strand':r['strand'],'coordinate_status':'direct official annotation','evidence':'Ensembl Regulatory Build 116','interpretation':'Overlaps the MANE inter-TSS interval; gene assignment must be read from the gene_name field.','gene_assignment':r['gene_name']})

          # Independent UCSC-hosted universes, parsed without inventing records
          def add_track(path,key,source):
              data=json.loads(path.read_text())
              for x in data.get(key,[]):
                  s=x.get('chromStart'); e=x.get('chromEnd')
                  if s is None or e is None: continue
                  typ=x.get('ccre') or x.get('elementType') or ('CpG island' if key=='cpgIslandExt' else '')
                  inter.append({'category':'regulatory_region','source':source,'element_id':x.get('name',''),'element_type':typ,'assembly':'GRCh38','start_1based':s+1,'end_1based':e,'strand':x.get('strand','.'),'coordinate_status':'direct UCSC track coordinates converted from 0-based BED to 1-based inclusive','evidence':x.get('evidenceSources','') or x.get('description',''),'interpretation':'Independent annotation overlapping the exact inter-TSS query interval.','gene_assignment':''})
          add_track(TMP/'ccre.json','encodeCcreCombined','ENCODE SCREEN cCRE via UCSC')
          add_track(TMP/'genehancer.json','geneHancerRegElements','GeneHancer via UCSC')
          add_track(TMP/'cpg.json','cpgIslandExt','UCSC CpG Islands')

          # FANTOM5/Fanta records: preserve native hg19 coordinates and do not mix with GRCh38
          for name,pid,s,e,strand in [
              ('p1@RPGRIP1L','hg_157410.1',53737742,53737790,'-'),
              ('p2@RPGRIP1L','hg_157411.1',53737795,53737806,'-'),
              ('p1@FTO','hg_154102.1',53738053,53738094,'+')]:
              inter.append({'category':'TSS/CAGE_peak','source':'FANTOM5 CAGE via Fanta FCHS_156247','element_id':pid,'element_type':name,'assembly':'hg19','start_1based':s,'end_1based':e,'strand':strand,'coordinate_status':'native coordinates reported by Fanta; liftover required before guide design','evidence':'Direct capped 5-prime RNA initiation evidence','interpretation':'Supports divergent initiation for FTO and RPGRIP1L.','gene_assignment':name.split('@')[-1]})

          # Exact sequence scan for reported motifs. Report coordinates only when sequence is found.
          motifs=[
              ('C/EBPalpha','TGGGAAAT','Positive FTO promoter regulator; reporter mutagenesis and ChIP'),
              ('FOXA2','AGCCTGTTTGCTC','Negative FTO promoter regulator; reporter mutagenesis, EMSA and ChIP'),
              ('SP1 proximal','GTAGCGGA','Basal/positive FTO promoter contribution; reporter mutagenesis')]
          comp=str.maketrans('ACGT','TGCA')
          for label,motif,evidence in motifs:
              found=False
              for strand,pattern in [('+',motif),('-',motif.translate(comp)[::-1])]:
                  pos=seq.find(pattern)
                  while pos!=-1:
                      found=True
                      inter.append({'category':'experimentally_supported_TF_motif','source':'Published functional FTO promoter studies','element_id':label,'element_type':'TF binding motif','assembly':'GRCh38','start_1based':left+pos,'end_1based':left+pos+len(pattern)-1,'strand':strand,'coordinate_status':'exact sequence match within the downloaded GRCh38 inter-TSS sequence','evidence':evidence,'interpretation':f'Reported motif sequence {motif}; exact match verified against the interval FASTA.','gene_assignment':'FTO'})
                      pos=seq.find(pattern,pos+1)
              if not found:
                  inter.append({'category':'experimentally_supported_TF_motif','source':'Published functional FTO promoter studies','element_id':label,'element_type':'TF binding motif','assembly':'GRCh38','start_1based':'','end_1based':'','strand':'','coordinate_status':'reported motif not found as an exact match in either strand of the downloaded interval; do not assign coordinates','evidence':evidence,'interpretation':f'Reported motif sequence {motif}; requires reconciliation of transcript/TSS or sequence conventions.','gene_assignment':'FTO'})

          inter=sorted(inter,key=lambda r:(str(r['assembly']), int(r['start_1based']) if str(r['start_1based']).isdigit() else 10**12, r['category']))
          write_csv(DATA/'FTO_RPGRIP1L_interTSS_elementos_regulatorios_conciliados.csv',inter)

          # Transcript TSS table documents alternative starts and avoids pretending there is one universal TSS
          tssrows=[]
          for gene,items in [('FTO',all_fto_tss),('RPGRIP1L',all_rp_tss)]:
              for tid,tss,strand,name,tags in sorted(items,key=lambda x:(x[1],x[0])):
                  tssrows.append({'gene':gene,'transcript_id':tid,'transcript_name':name,'tss_GRCh38_1based':tss,'strand':strand,'tags':tags,'is_MANE_Select':str(tid in (FTO_TX,RP_TX))})
          write_csv(DATA/'FTO_RPGRIP1L_transcritos_y_TSS_Ensembl116.csv',tssrows)

          counts={}
          for r in regs: counts[r['type']]=counts.get(r['type'],0)+1
          exact_motifs=[r for r in inter if r['category']=='experimentally_supported_TF_motif' and str(r['start_1based']).isdigit()]
          ccre=[r for r in inter if r['source'].startswith('ENCODE')]
          gh=[r for r in inter if r['source'].startswith('GeneHancer')]
          cpg=[r for r in inter if r['source'].startswith('UCSC CpG')]

          readme=f'''# 00 · LEER PRIMERO: dossier FTO para Claude y otros agentes

## Qué contiene esta carpeta

Esta carpeta concentra el conocimiento estructural y regulador utilizado para diseñar una activación epigenómica de **FTO** mediante dCas9-p300 en el Obligatorio. No reemplaza el archivo del tema candidato; lo complementa con anotación genómica auditable.

## Orden obligatorio de lectura

1. `../edicion_epigenomica_FTO_envejecimiento_ovarico.md`: hipótesis biológica y plan candidato.
2. `01_guia_maestra_locus_FTO.md`: estructura de FTO y Regulatory Build del locus.
3. `02_promotor_bidireccional_FTO_RPGRIP1L.md`: región exacta para diseñar las primeras guías.
4. `03_instrucciones_para_Claude.md`: reglas para razonar y no mezclar versiones ni niveles de evidencia.
5. `datos/`: tablas y FASTA utilizados por los documentos anteriores.

## Referencias de coordenadas

- Ensamblado de trabajo: **GRCh38.p14**.
- Ensembl: **release 116**.
- GENCODE: **release 50**.
- FTO MANE Select: `{FTO_TX}.{fto_tx['version']}`, TSS `chr16:{fto_tx['tss']}` en hebra positiva.
- RPGRIP1L MANE Select: `{RP_TX}.{rp_tx['version']}`, TSS `chr16:{rp_tx['tss']}` en hebra negativa.
- Diferencia entre coordenadas TSS: **{right-left} bp**.
- Intervalo inclusivo usado para inspección: `chr16:{left}-{right}`, **{right-left+1} nucleótidos**.
- Región estrictamente situada entre ambos nucleótidos TSS: `chr16:{left+1}-{right-1}`, **{right-left-1} bp**.

## Estado de conciliación

Los exones y las características Ensembl fueron extraídos automáticamente del GFF3 oficial. Los elementos ENCODE, GeneHancer y CpG fueron consultados en sus pistas UCSC para el intervalo exacto. Los picos FANTOM5 se mantienen en hg19 y están marcados como tales. Los motivos de factores de transcripción reciben coordenadas GRCh38 solamente cuando su secuencia exacta aparece en el FASTA descargado.

## Regla principal

La región no debe denominarse «promotor exclusivo de FTO». Es un **promotor divergente FTO–RPGRIP1L**. Cualquier guía dCas9-p300 colocada allí debe evaluarse midiendo simultáneamente ambos genes.
'''
          (OUT/'00_LEER_PRIMERO_CLAUDE.md').write_text(readme,encoding='utf-8')

          guide1=f'''# 01 · Guía maestra auditada del locus FTO

## Alcance

La referencia estructural es `{FTO_TX}.{fto_tx['version']}` (`{fto_tx['name']}`), MANE Select y Ensembl canonical. El intervalo regulador amplio comprende `chr16:{region_start}-{region_end}`, es decir, 1.800 bp upstream del TSS MANE y todo el transcrito.

Se recuperaron **{len(exons)} exones**, **{len(regs)} características regulatorias** y **{len(enh)} entradas tipo enhancer**. Desglose: {', '.join(f'{k}={v}' for k,v in sorted(counts.items()))}.

## Interpretación correcta

«{len(enh)} enhancers» significa {len(enh)} regiones clasificadas como enhancer por Ensembl Regulatory Build 116 que solapan el intervalo. No significa que todas regulen FTO ni que estén activas en granulosa.

El locus FTO contiene regulación intrónica abundante y relaciones tridimensionales conocidas con genes vecinos. La posición dentro de FTO no asigna automáticamente el gen diana. Para el proyecto deben distinguirse:

- anotación agregada del Regulatory Build;
- actividad en KGN o granulosa primaria;
- contacto físico con el promotor;
- efecto causal de una perturbación.

## Archivos estructurales

- `datos/FTO_exones_MANE_Ensembl116_GRCh38.csv`
- `datos/FTO_enhancers_Ensembl116_GRCh38_1p8kb_upstream.csv`
- `datos/FTO_todos_elementos_regulatorios_Ensembl116_GRCh38_1p8kb_upstream.csv`
- `datos/FTO_RPGRIP1L_transcritos_y_TSS_Ensembl116.csv`

## Consecuencias experimentales

Antes de elegir guías debe confirmarse el TSS utilizado en KGN o granulosa. La anotación MANE es la referencia operativa, no una demostración de predominio celular. También deben medirse RPGRIP1L, IRX3 e IRX5 para detectar efectos cis locales o conexiones del locus.
'''
          (OUT/'01_guia_maestra_locus_FTO.md').write_text(guide1,encoding='utf-8')

          guide2=f'''# 02 · Promotor divergente FTO–RPGRIP1L

## Intervalo operativo

- RPGRIP1L MANE TSS: `chr16:{left}`, hebra negativa.
- FTO MANE TSS: `chr16:{right}`, hebra positiva.
- Intervalo inclusivo: `chr16:{left}-{right}`.
- FASTA: `datos/FTO_RPGRIP1L_interTSS_GRCh38.fa`.

## Evidencia conciliada

El intervalo completo está cubierto por el promotor Ensembl compartido cuando la tabla oficial devuelve esa asociación. Para el mismo intervalo se recuperaron **{len(ccre)} cCRE ENCODE**, **{len(gh)} elementos GeneHancer** y **{len(cpg)} islas CpG** en las pistas consultadas. FANTOM5/Fanta aporta picos CAGE divergentes para FTO y RPGRIP1L; se mantienen en hg19 para impedir una mezcla accidental de ensamblados.

Los motivos publicados para C/EBPalpha, FOXA2 y SP1 fueron escaneados contra el FASTA GRCh38. Se asignaron coordenadas únicamente a **{len(exact_motifs)} coincidencias exactas**; cualquier motivo no encontrado queda explícitamente sin coordenadas.

## Diseño de guías

No seleccionar una guía solamente porque está cerca del TSS de FTO. El panel debe registrar:

- coordenada y PAM GRCh38;
- distancia a ambos TSS;
- solapamiento con cCRE, GeneHancer, CpG y motivos verificados;
- orientación de la guía;
- puntajes de actividad y especificidad;
- variantes frecuentes;
- efecto sobre FTO y RPGRIP1L por separado.

Para buscar direccionalidad hacia FTO conviene comparar guías distribuidas desde el centro del intervalo hacia el lado FTO, sin suponer de antemano que p300 será direccional. Una guía que aumente ambos genes puede representar un efecto cis esperado del promotor divergente y no un off-target de secuencia.

## Validación mínima

1. ChIP-qPCR o CUT&Tag de H3K27ac.
2. RT-qPCR y proteína de FTO.
3. RT-qPCR de RPGRIP1L.
4. Controles dCas9 sin efector y p300 catalíticamente inactiva.
5. Comparación con guía no dirigida.
6. Lecturas del eje FTO–m6A–FOS y senescencia solamente después de demostrar la activación local.
'''
          (OUT/'02_promotor_bidireccional_FTO_RPGRIP1L.md').write_text(guide2,encoding='utf-8')

          claude='''# 03 · Instrucciones para Claude

Trabajá con estos archivos como una base jerárquica, no como fragmentos equivalentes.

## Prioridad de fuentes

1. Coordenadas y modelos estructurales: GFF3 oficial Ensembl 116 / GENCODE 50.
2. Elementos regulatorios Ensembl: Regulatory Build 116.
3. Universos independientes: ENCODE SCREEN, GeneHancer, UCSC CpG y FANTOM5, conservando su ensamblado y ontología.
4. Motivos funcionales publicados: distinguir secuencia reportada, evidencia experimental y coordenada inferida o verificada.
5. Hipótesis del proyecto: nunca elevarla a hecho demostrado.

## Prohibiciones

- No mezclar hg19 y GRCh38.
- No afirmar que todos los enhancers del locus regulan FTO.
- No afirmar que están activos en granulosa sin datos específicos.
- No tratar el promotor como exclusivo de FTO.
- No usar una coordenada inferida como si proviniera de una base oficial.
- No asumir que dCas9-p300 corregirá una pérdida de H3K27ac previamente demostrada: esa pérdida todavía es una hipótesis experimental.
- No confundir los nueve exones MANE con el conjunto agregado de exones de todas las isoformas.

## Forma de responder

En cada afirmación importante indicar mentalmente si es:

- **hecho de anotación**;
- **evidencia experimental publicada**;
- **inferencia de integración**;
- **decisión de diseño**;
- **pregunta todavía abierta**.

Para proponer guías, usar el FASTA y la tabla inter-TSS. Presentar varias candidatas y explicar el compromiso entre proximidad a FTO, posible activación de RPGRIP1L, motivos ocupados, PAM, actividad y off-targets. No seleccionar una guía definitiva sin análisis de secuencia y especificidad.
'''
          (OUT/'03_instrucciones_para_Claude.md').write_text(claude,encoding='utf-8')

          # Append a discoverability link to the original candidate file, if found.
          candidates=list(Path('02_obligatorio/temas_candidatos').glob('*FTO*envejecimiento*md'))
          if candidates:
              p=candidates[0]; text=p.read_text(encoding='utf-8')
              marker='## Dossier genómico y regulador conciliado'
              if marker not in text:
                  text += f'\n\n{marker}\n\nAntes de diseñar las guías, leer [`FTO_dossier/00_LEER_PRIMERO_CLAUDE.md`](FTO_dossier/00_LEER_PRIMERO_CLAUDE.md). Allí se concentran las versiones de anotación, las coordenadas, el promotor divergente FTO–RPGRIP1L, las tablas regulatorias y las reglas para no mezclar niveles de evidencia.\n'
                  p.write_text(text,encoding='utf-8')

          summary={'FTO_MANE':fto_tx,'RPGRIP1L_MANE':rp_tx,'wide_interval':[region_start,region_end],'interTSS_inclusive':[left,right],'interTSS_coordinate_difference':right-left,'interTSS_inclusive_length':right-left+1,'exons':len(exons),'regulatory_features':len(regs),'enhancers':len(enh),'interTSS_rows':len(inter),'exact_reported_motif_matches':len(exact_motifs)}
          (DATA/'resumen_auditoria.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit dossier to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 02_obligatorio/temas_candidatos
          git commit -m 'Concilia dossier genómico y regulador de FTO para diseño de guías' || exit 0
          git push origin main
