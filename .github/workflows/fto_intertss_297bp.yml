name: Temporary FTO RPGRIP1L inter-TSS 297bp audit
on:
  push:
    branches: [tmp/fto-ensembl116-extraction]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fto-ensembl116-extraction
      - name: Query exact interval and regulatory universes
        run: |
          set -euo pipefail
          mkdir -p tmp_fto_intertss
          # UCSC uses 0-based half-open. This is chr16:53,703,859-53,704,156 in 1-based inclusive coordinates.
          BASE='https://api.genome.ucsc.edu/getData'
          curl -fsSL "$BASE/sequence?genome=hg38;chrom=chr16;start=53703858;end=53704156" -o tmp_fto_intertss/sequence.json
          for tr in cpgIslandExt encodeCcreCombined geneHancerRegElements geneHancerRegElementsDoubleElite; do
            curl -fsSL "$BASE/track?genome=hg38;track=${tr};chrom=chr16;start=53703858;end=53704156;maxItemsOutput=100000" -o "tmp_fto_intertss/${tr}.json" || true
          done
          curl -fsSL 'https://api.genome.ucsc.edu/list/tracks?genome=hg38;trackLeavesOnly=1' -o tmp_fto_intertss/track_list.json
          wget -q https://ftp.ensembl.org/pub/release-116/regulation/homo_sapiens/GRCh38/annotation/Homo_sapiens.GRCh38.regulatory_features.v116.gff3.gz -O tmp_fto_intertss/ensembl_reg.gff3.gz
          wget -q https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64/liftOver -O tmp_fto_intertss/liftOver
          chmod +x tmp_fto_intertss/liftOver
          wget -q https://hgdownload.soe.ucsc.edu/goldenpath/hg19/liftOver/hg19ToHg38.over.chain.gz -O tmp_fto_intertss/hg19ToHg38.over.chain.gz
          gunzip -f tmp_fto_intertss/hg19ToHg38.over.chain.gz
      - name: Parse and audit
        run: |
          python - <<'PY'
          import json,csv,gzip,re,subprocess
          from pathlib import Path
          out=Path('tmp_fto_intertss')
          start1,end1=53703859,53704156
          def write(path,rows):
              keys=[]
              for r in rows:
                  for k in r:
                      if k not in keys: keys.append(k)
              with open(path,'w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=keys); w.writeheader(); w.writerows(rows)
          # Sequence
          seqj=json.loads((out/'sequence.json').read_text())
          seq=seqj['dna'].upper()
          assert len(seq)==end1-start1+1, (len(seq),end1-start1+1)
          (out/'FTO_RPGRIP1L_interTSS_GRCh38.fa').write_text(f'>chr16:{start1}-{end1} GRCh38 1-based-inclusive\n'+seq+'\n')
          # motif scan for experimentally reported FTO promoter motifs
          motifs=[
            ('CEBPA_reported','TGGGAAAT','positive regulator; reporter mutagenesis and ChIP'),
            ('FOXA2_reported','AGCCTGTTTGCTC','negative regulator; reporter mutagenesis, EMSA and ChIP'),
            ('SP1_reported','GTAGCGGA','positive/basal promoter site; reporter mutagenesis'),
          ]
          comp=str.maketrans('ACGT','TGCA')
          motif_rows=[]
          for name,motif,evidence in motifs:
              for strand,s in [('+',motif),('-',motif.translate(comp)[::-1])]:
                  pos=seq.find(s)
                  while pos>=0:
                      motif_rows.append({'element':name,'motif_sequence_reference':motif,'matched_sequence_plus_strand':s,'strand':strand,'start_1based':start1+pos,'end_1based':start1+pos+len(s)-1,'evidence':evidence})
                      pos=seq.find(s,pos+1)
          write(out/'reported_motifs_exact_matches.csv',motif_rows)
          # Ensembl Regulatory Build exact overlaps
          ens=[]
          with gzip.open(out/'ensembl_reg.gff3.gz','rt') as f:
              for line in f:
                  if line.startswith('#'): continue
                  p=line.rstrip().split('\t')
                  if len(p)!=9 or p[0] not in ('16','chr16'): continue
                  s,e=int(p[3]),int(p[4])
                  if e<start1 or s>end1: continue
                  d={}
                  for x in p[8].split(';'):
                      if '=' in x:
                          k,v=x.split('=',1); d[k]=v
                  ens.append({'universe':'Ensembl Regulatory Build 116','type':p[2],'start_1based':s,'end_1based':e,'strand':p[6],**d})
          write(out/'ensembl_overlaps.csv',ens)
          # UCSC JSON tracks
          ucsc=[]
          for p in [out/'cpgIslandExt.json',out/'encodeCcreCombined.json',out/'geneHancerRegElements.json',out/'geneHancerRegElementsDoubleElite.json']:
              if not p.exists() or p.stat().st_size==0: continue
              data=json.loads(p.read_text()); track=p.stem
              arr=data.get(track,[])
              for r in arr:
                  rr={'universe':track,**r}
                  if 'chromStart' in r and 'chromEnd' in r:
                      rr['start_1based']=r['chromStart']+1; rr['end_1based']=r['chromEnd']
                  ucsc.append(rr)
          write(out/'ucsc_overlaps.csv',ucsc)
          # Discover relevant available UCSC tracks
          data=json.loads((out/'track_list.json').read_text())
          tracks=[]
          def walk(o,path=[]):
              if isinstance(o,dict):
                  # Dictionaries representing track metadata
                  label=' '.join(str(o.get(k,'')) for k in ('track','shortLabel','longLabel','type','group'))
                  track=o.get('track')
                  if track and any(q in label.lower() for q in ('fantom','cage','rampage','epd','reftss','promoter','tfbs','transcription factor','chip-seq','cpg','ccre','genehancer')):
                      tracks.append({'track':track,'shortLabel':o.get('shortLabel',''),'longLabel':o.get('longLabel',''),'type':o.get('type',''),'group':o.get('group','')})
                  for k,v in o.items():
                      if isinstance(v,dict):
                          # Often the key itself is the track identifier
                          label2=' '.join([str(k)]+[str(v.get(x,'')) for x in ('shortLabel','longLabel','type','group')])
                          if any(q in label2.lower() for q in ('fantom','cage','rampage','epd','reftss','promoter','tfbs','transcription factor','chip-seq','cpg','ccre','genehancer')):
                              tracks.append({'track':v.get('track',k),'shortLabel':v.get('shortLabel',''),'longLabel':v.get('longLabel',''),'type':v.get('type',''),'group':v.get('group','')})
                      walk(v,path+[k])
              elif isinstance(o,list):
                  for v in o: walk(v,path)
          walk(data)
          uniq={r['track']:r for r in tracks if r['track']}
          write(out/'relevant_ucsc_tracks.csv',sorted(uniq.values(),key=lambda r:r['track']))
          # FANTOM5 CAGE peaks shown by Fanta are hg19; lift to hg38.
          peaks=[
            ('p1@RPGRIP1L','chr16',53737742,53737790,'-','hg_157410.1'),
            ('p2@RPGRIP1L','chr16',53737795,53737806,'-','hg_157411.1'),
            ('p1@FTO','chr16',53738053,53738094,'+','hg_154102.1'),
          ]
          # Fanta coordinates are displayed as interval coordinates. Treat as BED-like for liftOver, retaining source representation.
          with open(out/'fantom_hg19.bed','w') as f:
              for name,chrom,s,e,strand,pid in peaks:
                  f.write(f'{chrom}\t{s}\t{e}\t{name}|{pid}\t0\t{strand}\n')
          subprocess.run([str(out/'liftOver'),str(out/'fantom_hg19.bed'),str(out/'hg19ToHg38.over.chain'),str(out/'fantom_hg38.bed'),str(out/'fantom_unmapped.bed')],check=True)
          lifted=[]
          for line in (out/'fantom_hg38.bed').read_text().splitlines():
              chrom,s,e,name,score,strand=line.split('\t')
              lifted.append({'universe':'FANTOM5 CAGE via Fanta; lifted hg19->hg38','name':name.split('|')[0],'id':name.split('|')[1],'chrom':chrom,'start_0based':int(s),'end_0based_exclusive':int(e),'start_1based':int(s)+1,'end_1based':int(e),'strand':strand})
          write(out/'fantom5_cage_peaks_lifted_hg38.csv',lifted)
          # Consolidated summary
          rows=[]
          for r in ens:
              rows.append({'category':'regulatory_region','source':r['universe'],'id':r.get('ID',''),'name':r.get('gene_name',''),'type':r['type'],'start_1based':r['start_1based'],'end_1based':r['end_1based'],'strand':r.get('strand',''),'evidence':'Ensembl aggregate regulatory annotation'})
          for r in ucsc:
              typ=r.get('ccre') or r.get('elementType') or ('CpG island' if r['universe']=='cpgIslandExt' else '')
              rows.append({'category':'regulatory_region','source':r['universe'],'id':r.get('name',''),'name':r.get('description',''),'type':typ,'start_1based':r.get('start_1based',''),'end_1based':r.get('end_1based',''),'strand':r.get('strand',''),'evidence':r.get('evidenceSources','')})
          for r in lifted:
              rows.append({'category':'TSS/CAGE_peak','source':r['universe'],'id':r['id'],'name':r['name'],'type':'CAGE peak','start_1based':r['start_1based'],'end_1based':r['end_1based'],'strand':r['strand'],'evidence':'FANTOM5 cap analysis of gene expression'})
          for r in motif_rows:
              rows.append({'category':'experimentally_supported_TF_motif','source':'published functional FTO promoter studies','id':r['element'],'name':r['motif_sequence_reference'],'type':'TF binding motif','start_1based':r['start_1based'],'end_1based':r['end_1based'],'strand':r['strand'],'evidence':r['evidence']})
          write(out/'FTO_RPGRIP1L_interTSS_regulatory_master.csv',rows)
          summary={'assembly':'GRCh38','interval_1based_inclusive':[start1,end1],'coordinate_difference_bp':end1-start1,'inclusive_length_bp':end1-start1+1,'strict_between_TSS_interval':[start1+1,end1-1],'strict_between_length_bp':end1-start1-1,'sequence_length':len(seq),'ensembl_records':len(ens),'ucsc_records':len(ucsc),'fantom_peaks':len(lifted),'motif_exact_matches':len(motif_rows),'sequence':seq}
          (out/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Query every discovered relevant UCSC track at the exact interval
        run: |
          python - <<'PY'
          import csv,json,subprocess,urllib.parse
          from pathlib import Path
          out=Path('tmp_fto_intertss')
          rows=list(csv.DictReader(open(out/'relevant_ucsc_tracks.csv')))
          results=[]
          for r in rows:
              tr=r['track']
              url=f'https://api.genome.ucsc.edu/getData/track?genome=hg38;track={urllib.parse.quote(tr)};chrom=chr16;start=53703858;end=53704156;maxItemsOutput=100000'
              p=subprocess.run(['curl','-fsSL',url],capture_output=True,text=True)
              if p.returncode: continue
              try: data=json.loads(p.stdout)
              except Exception: continue
              arr=data.get(tr,[])
              for item in arr:
                  rr={'track':tr,'shortLabel':r['shortLabel'],'longLabel':r['longLabel'],**item}
                  if 'chromStart' in item and 'chromEnd' in item:
                      rr['start_1based']=item['chromStart']+1; rr['end_1based']=item['chromEnd']
                  results.append(rr)
          keys=[]
          for r in results:
              for k in r:
                  if k not in keys: keys.append(k)
          with open(out/'all_discovered_ucsc_track_overlaps.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=keys); w.writeheader(); w.writerows(results)
          print('discovered track overlap rows',len(results))
          PY
      - name: Commit focused audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tmp_fto_intertss/liftOver tmp_fto_intertss/*.gz tmp_fto_intertss/*.chain tmp_fto_intertss/track_list.json tmp_fto_intertss/ensembl_reg.gff3.gz
          git add tmp_fto_intertss
          git commit -m 'Audit 297bp FTO-RPGRIP1L inter-TSS regulatory interval' || exit 0
          git push origin tmp/fto-ensembl116-extraction
